name: Test and deploy Tácticas Bárbaras to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript syntax
        run: |
          node --check shared/combat.js
          node --check public/network.js
          node --check public/app.js
          node --check server.js
      - name: Run engine tests
        run: node --test tests/*.test.js
      - name: Assemble static website
        run: |
          mkdir -p dist/shared
          cp public/index.html public/app.js public/network.js public/styles.css dist/
          cp shared/combat.js dist/shared/combat.js
          cp -R public/assets dist/assets
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
